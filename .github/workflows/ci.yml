name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node webpify.js --self-test
      - run: node test-extension.js

  # Only a release needs the five platform packages. An ordinary push to main runs
  # the tests and stops there, instead of building artefacts nothing consumes.
  package:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: darwin-arm64
            npm_flags: --os=darwin --cpu=arm64
          - target: darwin-x64
            npm_flags: --os=darwin --cpu=x64
          - target: linux-x64
            npm_flags: --os=linux --cpu=x64 --libc=glibc
          - target: linux-arm64
            npm_flags: --os=linux --cpu=arm64 --libc=glibc
          - target: win32-x64
            npm_flags: --os=win32 --cpu=x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # sharp ships a prebuilt binary per platform, so each .vsix has to carry the
      # right one. These flags make npm resolve the optional dep for the target,
      # not for the runner we happen to be on.
      - name: Install sharp for ${{ matrix.target }}
        run: npm install --no-audit --no-fund --include=optional ${{ matrix.npm_flags }}

      - name: Verify the bundled binary matches the target
        run: |
          ls node_modules/@img | grep -q "sharp-${{ matrix.target }}" \
            || { echo "::error::no @img/sharp-${{ matrix.target }} in node_modules"; ls node_modules/@img; exit 1; }

      - name: Package
        run: npx --yes @vscode/vsce package --target ${{ matrix.target }} -o webpify-${{ matrix.target }}.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix-${{ matrix.target }}
          path: '*.vsix'
          retention-days: 14

  publish:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Publishing the wrong version is not something you can take back.
      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != package.json $pkg"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -la dist

      # Split the two failure modes apart: a bad token fails here with a clear message,
      # so a failure in the publish step below means the packages, not the credentials.
      - name: Verify the token can publish as this publisher
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          [ -n "$VSCE_PAT" ] || { echo "::error::VSCE_PAT secret is not set"; exit 1; }
          publisher="$(node -p "require('./package.json').publisher")"
          echo "Verifying the PAT against publisher '$publisher'"
          npx --yes @vscode/vsce verify-pat "$publisher" || {
            echo "::error::The PAT cannot publish as '$publisher'. Check that it was created by the Microsoft account that owns the publisher, with Organization = All accessible organizations and scope Marketplace -> Manage."
            exit 1
          }

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish --packagePath dist/*.vsix

      - name: Attach the .vsix files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.vsix --generate-notes || gh release upload "$GITHUB_REF_NAME" dist/*.vsix --clobber

  publish-openvsx:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag must match package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != package.json $pkg"; exit 1; }

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          [ -n "$OVSX_PAT" ] || { echo "::error::OVSX_PAT secret is not set"; exit 1; }
          ns="$(node -p "require('./package.json').publisher")"

          # Open VSX returns transient 503s often enough to matter: one killed the v1.8.2
          # publish after three of five platforms, and another killed v1.8.3 at
          # create-namespace in 24s, before the publish retries could ever run. So every
          # call to it goes through here.
          # run_retry <label> <tolerated-substring> <command...>
          run_retry() {
            local what="$1" tolerate="$2"; shift 2
            local attempt out
            for attempt in 1 2 3 4; do
              if out="$("$@" 2>&1)"; then
                echo "$out"
                return 0
              fi
              echo "$out"
              if [ -n "$tolerate" ] && echo "$out" | grep -qi "$tolerate"; then
                echo "  -> $what: already done, continuing"
                return 0
              fi
              if [ "$attempt" -lt 4 ]; then
                echo "  -> $what: attempt $attempt failed, retrying in $((attempt * 15))s"
                sleep $((attempt * 15))
              fi
            done
            echo "::error::$what failed after 4 attempts"
            return 1
          }

          # A plain GET needs no token and skips the write call entirely once the
          # namespace exists, which it does after the first release.
          if curl -sf -o /dev/null "https://open-vsx.org/api/$ns"; then
            echo "Namespace '$ns' already exists."
          else
            run_retry "create-namespace" "already" \
              npx --yes ovsx create-namespace "$ns" -p "$OVSX_PAT" || exit 1
          fi

          # One call per platform build — each .vsix carries its own target. Every
          # package is attempted before the step fails, so one bad platform does not
          # hide whether the others made it.
          failed=0
          for f in dist/*.vsix; do
            echo "::group::$(basename "$f")"
            run_retry "$(basename "$f")" "already" \
              npx --yes ovsx publish "$f" -p "$OVSX_PAT" || failed=1
            echo "::endgroup::"
          done
          [ "$failed" -eq 0 ] || { echo "::error::at least one platform failed to publish"; exit 1; }
